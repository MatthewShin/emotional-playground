<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>골목의 불빛</title>
    <link rel="preload" as="image" href="images/japanese-house-light.png" />
    <link rel="preload" as="image" href="images/japanese-house-dark-1.png" />
    <link rel="preload" as="image" href="images/japanese-house-dark-2.png" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #071e2b;
      }

      main {
        width: min(100%, 680px);
      }

      .scene {
        position: relative;
        width: 100%;
        /* 보정한 이미지 아래에 빈 줄이 생기지 않도록 하단 5px만 잘라 낸다. */
        aspect-ratio: 1086 / 1443;
        overflow: hidden;
      }

      .scene-viewport {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      .artwork {
        position: relative;
        width: 100%;
        aspect-ratio: 1086 / 1443;
      }

      .scene img {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        width: 100%;
        height: auto;
      }

      /* 원본 이미지마다 장면의 세로 위치가 조금씩 달라 이를 맞춘다. */
      .scene img[data-alignment="dark-1"] {
        transform-origin: top left;
        transform: translateY(-0.07%) scaleY(0.999);
      }

      .scene img[data-alignment="dark-2"] {
        transform-origin: top left;
        transform: translateY(-0.07%) scaleY(0.997);
      }

      .state-image {
        opacity: 0;
        pointer-events: none;
        transition: opacity 450ms ease-in-out;
      }

      .scene.street-off .street-off-image,
      .scene.window-off:not(.street-off) .window-off-image,
      .scene.street-off.window-off .window-overlay {
        opacity: 1;
      }

      .window-overlay {
        pointer-events: none;
        mask-image: radial-gradient(
          ellipse 24% 15% at 50% 36%,
          #000 58%,
          transparent 95%
        );
      }

      @media (prefers-reduced-motion: reduce) {
        .state-image {
          transition: none;
        }
      }

      .switch {
        position: absolute;
        z-index: 1;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .switch:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      .streetlight-switch {
        left: 13.5%;
        top: 11.3%;
        width: 12.5%;
        height: 6.5%;
      }

      .window-switch {
        left: 48.5%;
        top: 30.7%;
        width: 8%;
        height: 6%;
      }

      .hint {
        position: absolute;
        z-index: 2;
        right: 0;
        bottom: 0;
        left: 0;
        margin: 0;
        padding: 3rem 1rem calc(1rem + env(safe-area-inset-bottom));
        background: linear-gradient(transparent, rgba(4, 16, 24, 0.78));
        color: #d3dfe3;
        font-size: 0.875rem;
        text-align: center;
        pointer-events: none;
      }

      .touch-count {
        display: inline-block;
        min-width: 1.2rem;
        margin-left: 0.35rem;
        padding: 0.1rem 0.3rem;
        border: 1px solid currentColor;
        border-radius: 2px;
        color: #fff;
        font-size: 0.75rem;
        line-height: 1.2;
      }

      .back-link {
        position: absolute;
        z-index: 3;
        bottom: calc(4.5rem + env(safe-area-inset-bottom));
        left: calc(1rem + env(safe-area-inset-left));
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border: 1px solid #d3dfe3;
        border-radius: 50%;
        background: #071e2b;
        color: #fff;
        opacity: 0.7;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      }

      .back-link:hover,
      .back-link:focus-visible {
        opacity: 1;
      }

      .back-link:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }

      @media (max-width: 680px) {
        body {
          display: block;
          min-height: 100dvh;
        }

        .scene {
          height: 100vh;
          height: 100dvh;
          aspect-ratio: auto;
        }

        .artwork {
          width: max(100%, calc(100vh * 0.7526));
          width: max(100%, calc(100dvh * 0.7526));
        }

        .scene-viewport {
          overflow-x: auto;
          overflow-y: hidden;
          overscroll-behavior-x: contain;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div id="scene" class="scene">
        <div
          id="scene-viewport"
          class="scene-viewport"
          tabindex="0"
          aria-label="골목 이미지 좌우로 스크롤"
        >
          <div class="artwork">
            <img
              src="images/japanese-house-light.png"
              alt="해 질 무렵 일본 골목의 이자카야와 가로등"
              width="1086"
              height="1448"
            />
            <img
              class="state-image street-off-image"
              src="images/japanese-house-dark-1.png"
              alt=""
              width="1086"
              height="1448"
              data-alignment="dark-1"
            />
            <img
              class="state-image window-off-image"
              src="images/japanese-house-dark-2.png"
              alt=""
              width="1086"
              height="1448"
              data-alignment="dark-2"
            />
            <img
              class="state-image window-overlay"
              src="images/japanese-house-dark-2.png"
              alt=""
              width="1086"
              height="1448"
              data-alignment="dark-2"
            />
            <button
              id="streetlight-switch"
              class="switch streetlight-switch"
              type="button"
              aria-label="가로등 끄기"
              aria-pressed="true"
            ></button>
            <button
              id="window-switch"
              class="switch window-switch"
              type="button"
              aria-label="2층 전등 끄기"
              aria-pressed="true"
            ></button>
          </div>
        </div>
        <a class="back-link" href="../index.html" aria-label="목록으로 돌아가기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 5 5 12l7 7M5 12h14" stroke="currentColor" stroke-width="2" />
          </svg>
        </a>
        <p class="hint">화면을 잘 찾아서 터치해봐 <span class="touch-count">2</span></p>
      </div>
    </main>

    <script>
      const scene = document.querySelector('#scene');
      const sceneViewport = document.querySelector('#scene-viewport');
      const streetlightSwitch = document.querySelector('#streetlight-switch');
      const windowSwitch = document.querySelector('#window-switch');

      let streetlightOn = true;
      let windowLightOn = true;

      requestAnimationFrame(() => {
        sceneViewport.scrollLeft = (sceneViewport.scrollWidth - sceneViewport.clientWidth) / 2;
      });

      function render() {
        scene.classList.toggle('street-off', !streetlightOn);
        scene.classList.toggle('window-off', !windowLightOn);
        streetlightSwitch.setAttribute('aria-pressed', String(streetlightOn));
        streetlightSwitch.setAttribute('aria-label', `가로등 ${streetlightOn ? '끄기' : '켜기'}`);
        windowSwitch.setAttribute('aria-pressed', String(windowLightOn));
        windowSwitch.setAttribute('aria-label', `2층 전등 ${windowLightOn ? '끄기' : '켜기'}`);
      }

      streetlightSwitch.addEventListener('click', () => {
        streetlightOn = !streetlightOn;
        render();
      });

      windowSwitch.addEventListener('click', () => {
        windowLightOn = !windowLightOn;
        render();
      });
    </script>
  </body>
</html>
